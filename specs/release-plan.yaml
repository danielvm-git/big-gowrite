# gowrite release plan — index. Detail is sharded under specs/epics/.
# NOTE: epics are listed in TOPOLOGICAL execution order (data/write dependencies),
# which governs a Strangler-Fig migration. wsjf is recorded per epic for prioritising
# within unblocked choices, but does not override the dependency order.
release:
  version: "0.1.0"          # non-authoritative mirror; no semantic-release/CI yet
  codename: "gowrite"
  status: planning
  semantic_release: false
  bump_hint: minor
  ordering: topological     # execution follows sequence, not raw wsjf
epics:
  - id: e01
    title: "Platform Foundation"
    sequence: 1
    wsjf: 5.6
    total_bcps: 19
    capsule_dir: epics/e01-platform-foundation
    file: epics/e01-platform-foundation/epic.yaml
    note: "Foundational; every context depends on it. Security-sensitive (crypto + auth). Topological seq 1."
  - id: e02
    title: "Identity (accounts, sessions, MFA, tokens)"
    sequence: 2
    wsjf: 4.5
    total_bcps: 13
    capsule_dir: epics/e02-identity
    file: epics/e02-identity/epic.yaml
    note: "Co-flips atomically with e03 organizations (team-invite writes users+sessions+teams+memberships in one request). Security-sensitive. Topological seq 2."
  - id: e03
    title: "Organizations (teams & memberships)"
    sequence: 3
    wsjf: 5.25
    total_bcps: 8
    capsule_dir: epics/e03-organizations
    file: epics/e03-organizations/epic.yaml
    note: "Co-flips atomically with e02 identity. Topological seq 3 (same flip unit as identity)."
  - id: e04
    title: "Projects (+ platforms, keys, webhooks)"
    sequence: 4
    wsjf: 4.2
    total_bcps: 8
    capsule_dir: epics/e04-projects
    file: epics/e04-projects/epic.yaml
    note: "Sole owner of the projects collection (red-team B1). Depends on organizations. Topological seq 4."
  - id: e05
    title: "Data (databases, documents, transactions, vectors)"
    sequence: 5
    wsjf: 2.625
    total_bcps: 18
    capsule_dir: epics/e05-data
    file: epics/e05-data/epic.yaml
    note: "Depends on projects. Document ACL + transactions are security/correctness sensitive. Topological seq 5."
  - id: e06
    title: "Storage (buckets, files, chunked upload)"
    sequence: 6
    wsjf: 3.0
    total_bcps: 8
    capsule_dir: epics/e06-storage
    file: epics/e06-storage/epic.yaml
    note: "Depends on projects. Upload finalize (AV/encrypt) is security-sensitive. Topological seq 6."
  - id: e07
    title: "VCS (installations & repo events)"
    sequence: 7
    wsjf: 4.25
    total_bcps: 6
    capsule_dir: epics/e07-vcs
    file: epics/e07-vcs/epic.yaml
    note: "Migrated before/with compute; Compute reads installations synchronously (red-team S4/B2). Topological seq 7."
  - id: e08
    title: "Compute (functions, sites, executions)"
    sequence: 8
    wsjf: 2.25
    total_bcps: 11
    capsule_dir: epics/e08-compute
    file: epics/e08-compute/epic.yaml
    note: "Consumes VCS events. Executor/browser remain external (BR-HUMANA-003). Topological seq 8."
  - id: e09
    title: "Networking (proxy rules, domains, TLS)"
    sequence: 9
    wsjf: 2.8
    total_bcps: 6
    capsule_dir: epics/e09-networking
    file: epics/e09-networking/epic.yaml
    note: "TLS certificate lifecycle is security-sensitive. Topological seq 9."
  - id: e10
    title: "Messaging (email/SMS/push)"
    sequence: 10
    wsjf: 2.6
    total_bcps: 6
    capsule_dir: epics/e10-messaging
    file: epics/e10-messaging/epic.yaml
    note: "Message lifecycle with idempotent terminal state. Topological seq 10."
  - id: e11
    title: "Migrations (data import jobs)"
    sequence: 11
    wsjf: 3.67
    total_bcps: 3
    capsule_dir: epics/e11-migrations
    file: epics/e11-migrations/epic.yaml
    note: "Import/migration jobs with retry-only-from-failed. Topological seq 11."
  - id: e12
    title: "Advisor (recommendations)"
    sequence: 12
    wsjf: 3.5
    total_bcps: 2
    capsule_dir: epics/e12-advisor
    file: epics/e12-advisor/epic.yaml
    note: "Smallest context. Topological seq 12."
  - id: e13
    title: "Console BFF + SPA hosting"
    sequence: 13
    wsjf: 3.4
    total_bcps: 6
    capsule_dir: epics/e13-console-bff
    file: epics/e13-console-bff/epic.yaml
    note: "Depends on identity/orgs/projects. Serves the preserved SvelteKit SPA. Topological seq 13."
  - id: e14
    title: "Cross-cutting workers (Deletes, Stats)"
    sequence: 14
    wsjf: 4.67
    total_bcps: 5
    capsule_dir: epics/e14-cross-cutting-workers
    file: epics/e14-cross-cutting-workers/epic.yaml
    note: "Migrated last, after every context they touch is on Postgres (red-team S3). Topological seq 14."
  - id: e15
    title: "Parity harness & cutover"
    sequence: 15
    wsjf: 5.2
    total_bcps: 13
    capsule_dir: epics/e15-parity-and-cutover
    file: epics/e15-parity-and-cutover/epic.yaml
    note: "The safety mechanism applied to every context flip. High RR. Runs alongside every epic's flip. Topological seq 15 (spans all flips)."
bugs:
  total: 0
  fixed: 0
  deferred: 0
  wontfix: 0
  open: 0
  registry: null   # specs/bugs/registry.yaml absent
