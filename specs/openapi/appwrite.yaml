info:
  title: Appwrite Legacy API — Reverse-Engineered OpenAPI Contract
  version: 1.0.0-reversa
  description: 'Consolidated HTTP contract reverse-engineered from the Appwrite codebase. Generated by the Reversa Writer from the 22 unit legacy-mapping.md files (specs/<Unit>/). Path parameters use OpenAPI {param} templating. The /v1 prefix is kept inside paths; the server base URL is https://HOSTNAME. Databases mirrors (/v1/tablesdb, /v1/documentsdb, /v1/vectorsdb) are derived from the legacy mapping substitution rules; their operationIds are prefixed with the namespace. Components schemas are minimal operational contracts — detailed attribute rules live in the per-unit contracts.md/design.md specs. Confidence: 🟢 operations confirmed against module HTTP registries (see x-reversa-unit / x-reversa-scope); mirrored namespaces are 🟡 INFERRED by substitution from the legacy mapping.'
