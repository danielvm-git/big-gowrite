components:
  securitySchemes:
    X-Appwrite-Project:
      type: apiKey
      in: header
      name: X-Appwrite-Project
      description: Project ID (required for all project-scoped requests)
    X-Appwrite-Key:
      type: apiKey
      in: header
      name: X-Appwrite-Key
      description: API secret key (server-side auth)
    X-Appwrite-JWT:
      type: apiKey
      in: header
      name: X-Appwrite-JWT
      description: Session JWT (client-side auth)
  schemas:
    user:
      type: object
      description: User account (Account & Users)
      properties:
        $id:
          type: string
          description: Unique ID
        $createdAt:
          type: string
          description: ISO 8601 creation time
        name:
          type: string
        email:
          type: string
        status:
          type: integer
        registration:
          type: string
      additionalProperties: true
    userList:
      type: object
      description: List of users
      properties:
        total:
          type: integer
          description: Total items
        documents:
          type: array
          description: Items
          items:
            $ref: '#/components/schemas/user'
        sum:
          type: integer
          description: Sum of total
      additionalProperties: true
    session:
      type: object
      description: Session
      properties:
        $id:
          type: string
          description: Unique ID
        $createdAt:
          type: string
          description: ISO 8601 creation time
        userId:
          type: string
        expire:
          type: string
        provider:
          type: string
        osCode:
          type: string
        clientName:
          type: string
      additionalProperties: true
    sessionList:
      type: object
      description: List of sessions
      properties:
        total:
          type: integer
          description: Total items
        documents:
          type: array
          description: Items
          items:
            $ref: '#/components/schemas/session'
        sum:
          type: integer
          description: Sum of total
      additionalProperties: true
    identity:
      type: object
      description: Identity
      properties:
        $id:
          type: string
          description: Unique ID
        $createdAt:
          type: string
          description: ISO 8601 creation time
        provider:
          type: string
        providerUid:
          type: string
        userEmail:
          type: string
      additionalProperties: true
    identityList:
      type: object
      description: List of identities
      properties:
        total:
          type: integer
          description: Total items
        documents:
          type: array
          description: Items
          items:
            $ref: '#/components/schemas/identity'
        sum:
          type: integer
          description: Sum of total
